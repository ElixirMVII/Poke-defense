<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<title>Poke Defense — Pokédex Gen 1</title>
<style>
 body{background:#141b2a;color:#e8edf7;font-family:system-ui,sans-serif;margin:0;padding:24px}
 h2{font-size:15px;margin:22px 0 10px;color:#ffd54a}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
 .cell{background:#1d2740;border:1px solid #2e3a55;border-radius:10px;padding:8px 4px;text-align:center}
 .cell img{width:64px;height:64px;image-rendering:pixelated;object-fit:contain;display:block;margin:0 auto}
 .n{font-size:11px;margin-top:4px;font-weight:700}
 .no{font-size:9px;color:#6d7b96}
 .t{font-size:9px;color:#93a0bd}
 .s{font-size:9px;color:#ffd54a;margin-top:2px}
</style></head><body>
<h2 id="h">Pokédex Gen 1 — 151 ตัว</h2>
<div class="grid" id="all"></div>
<script src="../js/types.js"></script><script src="../js/gen1.js"></script>
<script src="../js/derive.js"></script><script src="../js/sprites.js"></script>
<script>
const box=document.getElementById('all');
for(const d of PTD.DEX){
  const t=PTD.tower(d.id);
  const c=document.createElement('div'); c.className='cell';
  c.innerHTML=`<img src="${PTD.sprites.stillURL(d.id)}" alt="" loading="lazy">
    <div class="n">${d.n}</div>
    <div class="no">#${String(d.id).padStart(3,'0')} · BST ${d.bst}</div>
    <div class="t">${d.t.map(x=>PTD.TYPE_TH[x]).join('/')}</div>
    <div class="s">₽${t.cost} · ${Math.round(t.dmg*t.rate)} dps</div>`;
  box.appendChild(c);
}
document.getElementById('h').textContent =
  `Pokédex Gen 1 — ${PTD.DEX.length} ตัว (ซื้อได้ ${PTD.BASE_FORMS.length} ตัว)`;
</script></body></html>
