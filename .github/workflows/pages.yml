# เผยแพร่เกมขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# configure-pages ที่ตั้ง enablement: true จะเปิด Pages ให้เองถ้ายังไม่ได้เปิด
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งค่า Pages (เปิดให้เองถ้ายังไม่เปิด)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: อัปโหลดทั้งโฟลเดอร์ (เกมเป็นไฟล์นิ่งล้วน ไม่ต้อง build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: เผยแพร่
        id: deployment
        uses: actions/deploy-pages@v4
